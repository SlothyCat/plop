<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EDE6C8; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes addhalo {
    0%   { box-shadow: 0 0 0 0 rgba(140,192,235,0.5); }
    70%  { box-shadow: 0 0 0 16px rgba(140,192,235,0); }
    100% { box-shadow: 0 0 0 0 rgba(140,192,235,0); }
  }
  @keyframes iconpop {
    0%   { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes donutFade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
</style>
