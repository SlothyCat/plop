<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>plop — Launch Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #C7DCEE; -webkit-font-smoothing: antialiased; }

  /* coin falls from above the surface, settles at rest, with a tiny bounce */
  @keyframes coinDrop {
    0%   { transform: translateY(-190px) scale(0.82); opacity: 0; }
    55%  { transform: translateY(6px)    scale(1);    opacity: 1; }
    72%  { transform: translateY(-10px)  scale(1); }
    100% { transform: translateY(0)      scale(1);    opacity: 1; }
  }
  /* ripple rings expand outward + fade after the coin lands */
  @keyframes ripple {
    0%   { transform: scale(0.35); opacity: 0; }
    18%  { opacity: var(--peak, 0.7); }
    100% { transform: scale(1);    opacity: 0; }
  }
  /* gentle perpetual bob once settled */
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  @keyframes riseFade {
    from { transform: translateY(14px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  @keyframes dotPulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40%           { opacity: 1;   transform: scale(1); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="frames/ios-frame.jsx"></script>

<script type="text/babel">
const { useState } = React;

// plop palette (from the app + logo)
const SKY_T = '#A8D3F2', SKY_B = '#7EB7E8', SKY_DEEP = '#5C9FD8';
const CREAM = '#FFE7BC', CREAM_RING = '#F4D49A', CREAM_LT = '#FFF3D6';
const INK = '#5A4632', CREAM_O = '#E7AE52', WHITE = '#FFFFFF';

// Smiling coin — same construction as the app icon's hero mark
function Coin({ r = 46 }) {
  return (
    <svg width={r * 2} height={r * 2} viewBox="0 0 100 100" style={{ display: 'block' }}>
      <defs>
        <radialGradient id="coinFace" cx="0.4" cy="0.34" r="0.85">
          <stop offset="0" stopColor={CREAM_LT} />
          <stop offset="1" stopColor={CREAM} />
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="46" fill="url(#coinFace)" />
      <circle cx="50" cy="50" r="46" fill="none" stroke={CREAM_RING} strokeWidth="3" />
      <circle cx="50" cy="50" r="37" fill="none" stroke={CREAM_LT} strokeWidth="3.4" />
      <circle cx="40" cy="46" r="4.2" fill={INK} />
      <circle cx="60" cy="46" r="4.2" fill={INK} />
      <path d="M39 58 Q50 70 61 58" fill="none" stroke={INK} strokeWidth="4.6" strokeLinecap="round" />
    </svg>
  );
}

// One expanding ripple ring on the "water surface"
function Ripple({ delay, rx, peak, dur = 2600 }) {
  return (
    <div style={{
      position: 'absolute', left: '50%', top: 0,
      width: rx * 2, height: rx * 0.62,
      marginLeft: -rx,
      border: `2.5px solid ${WHITE}`,
      borderRadius: '50%',
      transform: 'translateY(-50%)',
      transformOrigin: 'center',
      animation: `ripple ${dur}ms cubic-bezier(0.22,0.61,0.36,1) ${delay}ms infinite`,
      ['--peak']: peak,
    }} />
  );
}

function LaunchScreen() {
  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: `linear-gradient(180deg, ${SKY_T} 0%, ${SKY_B} 100%)`,
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      fontFamily: "'Baloo 2', sans-serif", overflow: 'hidden',
    }}>
      {/* soft top glow */}
      <div style={{
        position: 'absolute', top: -120, left: '50%', transform: 'translateX(-50%)',
        width: 460, height: 460, borderRadius: '50%',
        background: 'radial-gradient(circle, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 62%)',
        pointerEvents: 'none',
      }} />

      {/* faint floating bokeh coins */}
      <div style={{ position: 'absolute', top: 150, left: 44, width: 12, height: 12, borderRadius: '50%', background: 'rgba(255,255,255,0.35)' }} />
      <div style={{ position: 'absolute', top: 232, right: 52, width: 8, height: 8, borderRadius: '50%', background: 'rgba(255,255,255,0.28)' }} />
      <div style={{ position: 'absolute', bottom: 250, left: 60, width: 9, height: 9, borderRadius: '50%', background: 'rgba(255,255,255,0.25)' }} />

      {/* hero: coin + ripples */}
      <div style={{
        position: 'absolute', top: '34%', left: '50%', transform: 'translate(-50%, -50%)',
        width: 240, height: 240,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>
        {/* ripple surface sits just under the coin's rest position */}
        <div style={{ position: 'absolute', top: '64%', left: 0, right: 0, height: 0 }}>
          <Ripple delay={650}  rx={120} peak={0.5} />
          <Ripple delay={1050} rx={92}  peak={0.65} />
          <Ripple delay={1450} rx={62}  peak={0.85} />
        </div>

        {/* the coin itself: drop in, then settle into a perpetual bob */}
        <div style={{
          position: 'relative',
          animation: 'coinDrop 1100ms cubic-bezier(0.34,1.2,0.5,1) both',
          filter: 'drop-shadow(0 12px 18px rgba(40,80,120,0.28))',
        }}>
          <div style={{ animation: 'bob 3800ms ease-in-out 1200ms infinite' }}>
            <Coin r={46} />
          </div>
        </div>
      </div>

      {/* wordmark + tagline, lower third */}
      <div style={{
        position: 'absolute', top: '60%', left: 0, right: 0,
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14,
      }}>
        <div style={{
          display: 'flex', alignItems: 'baseline', justifyContent: 'center',
          fontWeight: 800, fontSize: 76, color: WHITE, letterSpacing: -2, lineHeight: 1,
          animation: 'riseFade 700ms cubic-bezier(0.22,0.61,0.36,1) 900ms both',
          textShadow: '0 3px 10px rgba(40,80,120,0.22)',
        }}>
          <span>pl</span>
          <span style={{ color: CREAM }}>o</span>
          <span>p</span>
        </div>

        <div style={{
          fontWeight: 600, fontSize: 19, color: 'rgba(255,255,255,0.92)',
          letterSpacing: 0.2,
          animation: 'riseFade 700ms cubic-bezier(0.22,0.61,0.36,1) 1150ms both',
        }}>
          Designed for Simplicity
        </div>
      </div>

      {/* bottom: loading dots */}
      <div style={{
        position: 'absolute', bottom: 70, left: 0, right: 0,
        display: 'flex', gap: 9, justifyContent: 'center',
        animation: 'riseFade 600ms ease 1500ms both',
      }}>
        {[0, 1, 2].map(i => (
          <div key={i} style={{
            width: 8, height: 8, borderRadius: '50%', background: WHITE,
            animation: `dotPulse 1400ms ease-in-out ${i * 220}ms infinite`,
          }} />
        ))}
      </div>
    </div>
  );
}

function App() {
  const [k, setK] = useState(0); // replay key
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 18,
      minHeight: '100vh', justifyContent: 'center', padding: 28,
      background: '#C7DCEE',
    }}>
      <IOSDevice width={393} height={852}>
        <div key={k} style={{ position: 'absolute', inset: 0 }}>
          <LaunchScreen />
        </div>
      </IOSDevice>
      <button onClick={() => setK(k + 1)} style={{
        border: 'none', background: 'rgba(255,255,255,0.8)', color: '#2C3440',
        fontFamily: "'Baloo 2', sans-serif", fontWeight: 700, fontSize: 14,
        padding: '9px 20px', borderRadius: 999, cursor: 'pointer',
        boxShadow: '0 2px 8px rgba(40,70,110,0.12)',
      }}>↻ Replay</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
