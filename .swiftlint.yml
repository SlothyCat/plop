# SwiftLint config — flexible profile for a SwiftUI + SwiftData app.
# Philosophy: keep rules that catch real bugs or genuinely improve clarity;
# drop purely cosmetic rules that create churn (especially with AI-generated code).

# ---- What to skip ----
excluded:
  - .build           # SwiftPM build output
  - build            # xcodebuild output
  - DerivedData      # Xcode derived data if it lands in-repo
  - "**/*.generated.swift"

# ---- Opt-in rules worth keeping (correctness + low-friction clarity) ----
opt_in_rules:
  # Idiomatic collection usage — these catch real inefficiencies/bugs
  - array_init
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - last_where
  - flatmap_over_map_reduce
  - reduce_into
  - sorted_first_last
  # Correctness / safety
  - fallthrough
  - fatal_error_message
  - identical_operands
  - legacy_multiple
  - legacy_random
  - lower_acl_than_parent
  - overridden_super_call
  - prohibited_super_call
  - unavailable_function
  - unowned_variable_capture
  - untyped_error_in_catch
  - redundant_nil_coalescing
  - toggle_bool
  # Light clarity wins
  - closure_spacing
  - joined_default_parameter
  - modifier_order
  - operator_usage_whitespace
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition
  # Test hygiene (you're on XCTest)
  - empty_xctest_method
  - xct_specific_matcher

# ---- Default rules turned off (too rigid for SwiftUI / personal style) ----
disabled_rules:
  - identifier_name                       # short names like id, x, vm are fine
  - type_name                             # allow flexible type naming
  - todo                                  # TODO/FIXME comments are allowed
  - multiple_closures_with_trailing_closure  # common & readable in SwiftUI
  - trailing_comma                        # multiline literals read fine with trailing commas

# ---- Relaxed thresholds (SwiftUI view bodies get long; that's normal) ----
line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 25

# ---- Notes ----
# Analyzer rules (explicit_self, unused_import, unused_declaration) were dropped.
# They require `swiftlint analyze` with full compiler args, which is slower and
# more fragile in CI than plain `swiftlint lint`. Add them back later if you want
# them, but they're not worth the setup for a flexible solo profile.
