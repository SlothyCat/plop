name: CI

# Run on pull requests targeting main (the merge gate) and on direct pushes to
# main (so the badge on your default branch stays accurate).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# If you push twice quickly to the same PR, cancel the older run so you're not
# burning a runner on a stale commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint runs on a cheap Linux container (no Xcode/simulator needed) in parallel
  # with the build, so style feedback lands fast and doesn't burn macOS minutes.
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads .swiftlint.yml from the repo root automatically.
      # No --strict: warnings stay warnings (matching the flexible config);
      # only error-level violations fail the job.
      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  test:
    name: Build & Test
    runs-on: macos-15   # macOS Sequoia image; ships with recent Xcode + iOS 18 simulators

    env:
      # The .xcodeproj lives in the plop/ subdirectory, not the repo root.
      # If you use an .xcworkspace (e.g. SPM/CocoaPods integration), set WORKSPACE instead.
      PROJECT: plop/plop.xcodeproj
      WORKSPACE: ""
      SCHEME: plop
      # OS=latest avoids pinning an exact runtime: GitHub rotates simulator
      # runtimes in/out of the runner image over time, so a hard pin (e.g. 18.2)
      # eventually fails with "Unable to find a device matching...". Deployment
      # target is iOS 18.0, so testing on whatever current iOS the runner has is valid.
      DESTINATION: "platform=iOS Simulator,name=iPhone 16,OS=latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Select the NEWEST Xcode installed on the runner. This must stay aligned with
      # the DESTINATION's OS=latest: an old pinned Xcode (e.g. 16.2) cannot drive a
      # newer simulator runtime (e.g. iOS 26), which fails with exit code 70. Picking
      # the latest Xcode keeps the toolchain and the latest runtime in lockstep.
      - name: Select Xcode
        run: |
          LATEST_XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LATEST_XCODE" ]; then
            echo "No version-suffixed Xcode found; using the runner default."
          else
            echo "Selecting newest Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Show versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # Cache derived data / SPM dependencies to speed up later runs.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build & test
        run: |
          if [ -n "$WORKSPACE" ]; then
            CONTAINER_FLAG=(-workspace "$WORKSPACE")
          else
            CONTAINER_FLAG=(-project "$PROJECT")
          fi

          set -o pipefail
          # -only-testing:plopTests runs just the unit tests. The UI test targets
          # (plopUITests/...) boot the simulator and launch the app, which is slow
          # and flaky in CI — and per CLAUDE.md, views are validated via #Preview /
          # the simulator, not automated UI tests. Drop this flag if you ever want
          # UI tests in CI.
          xcodebuild test \
            "${CONTAINER_FLAG[@]}" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:plopTests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # Convert Xcode's .xcresult coverage into the Cobertura XML that Codecov reads.
      # xcresultparser is the lightweight tool for this; no Ruby/Slather needed.
      - name: Export coverage
        if: ${{ !cancelled() }}
        run: |
          brew install xcresultparser
          xcresultparser --output-format cobertura TestResults.xcresult > coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false   # don't fail the build just because the upload hiccuped
          # No token needed for a PUBLIC repo. If you ever make the repo private,
          # add a CODECOV_TOKEN secret and pass: token: ${{ secrets.CODECOV_TOKEN }}

      # Keep the raw result bundle as an artifact so you can open failures in Xcode.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
